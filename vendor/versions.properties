# The vendored toolchain, pinned in one place.
#
# Read twice: by `build.gradle.kts`, which publishes these as the POM's
# dependencies and refuses to build a jar whose vendor/jars disagree with them,
# and by `losim dev vendor`, which is what downloaded them. Those two used to
# hold the numbers separately, which is a way of saying that a bump in one was a
# silent lie in the other — the published POM would name a gRPC nobody here had
# ever compiled against.
#
# protobuf is NOT the 3.25.9 that grpc-protobuf pins: 3.25 calls a deprecated
# sun.misc.Unsafe that warns loudly on JDK 25. 4.x is binary-compatible with
# grpc 1.83 and silent. Verified by spike.
#
# JUnit is here because a student debugs a handler in an ordinary JUnit test with
# no simulation running (D2), so it is part of the toolchain rather than
# something they have to go and find. It stays out of vendor/jars: a lab's own
# code must not be able to reach it.
grpc=1.83.1
protobuf=4.36.0
common-protos=2.64.1
guava=33.6.0-jre
failureaccess=1.0.2
gson=2.14.0
android-annotations=4.1.1.4
animal-sniffer-annotations=1.27
error_prone_annotations=2.50.0
perfmark-api=0.27.0
jsr305=3.0.2
junit=5.14.0
junit-platform=1.14.0
opentest4j=1.3.0
apiguardian-api=1.1.2
