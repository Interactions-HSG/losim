# Johannesburg — Azure southafricanorth
#
# Prices are course data, not library data — edit here, never in the simulator.
#
# **These are estimates, not a vendor's list prices.** Every figure is the
# Frankfurt baseline times this region's index of 1.35; the index is a rough
# ordering of what infrastructure costs where, not a quotation from anybody. They
# are here to make one question answerable — *what does it cost to put this
# machine over there?* — and they are wrong in the third decimal on purpose,
# because a number that looked authoritative would be argued with instead of
# reasoned from. prices/README.md has the whole model.
#
# What a machine costs to rent is deliberately absent: that belongs to the
# instance catalogue, beside its vCPUs and its memory, because it is a property
# of the machine rather than a choice this course makes.
region: southafricanorth
currency: CHF

# A reclaimable machine is cheaper and can be taken away mid-job. Both halves of that
# bargain are modelled: the discount here, the spot_reclaim fault in the scenario.
spot_discount: 0.70

# Talking, at three distances. Traffic inside one zone is free and has no rate.
# The gap between the first and the last is the whole point: a cluster that talks
# across an ocean because nobody looked at the zones pays 9 times what the
# same traffic costs at home.
egress_per_gb: 0.0135                   # between zones, inside this region
egress_cross_region_per_gb: 0.0270      # to another region on this continent
egress_intercontinental_per_gb: 0.1215  # across an ocean

# Bytes between two machines in one zone: half what it costs to cross one. Not
# free, and that is a deliberate departure from the sticker price — a cloud
# carries two instances in one zone for nothing only over a private address, with
# nothing in the path, and a real cluster's traffic goes through a load balancer,
# a gateway or a mesh often enough that free is the exception rather than the
# rule. Cheaper than the zone next door, so the distance still teaches something.
egress_same_zone_per_gb: 0.0067

# A toll on every byte the cluster carried, whatever distance it went. Zero, and
# not a distance at all: it is whatever stands in the path. A NAT gateway takes
# about 0.045 a gigabyte processed on top of transfer, and a load balancer or a
# mesh's sidecar takes its own cut. Set it and every byte on the wire pays twice.
nat_per_gb: 0.00

storage_per_gb_month: 0.1350

# You pay for a machine from the moment you ask for it, with a floor. A design that
# starts forty machines to do four seconds of work pays for a minute of forty.
billing_minimum_seconds: 60

# Engineering time, spread over the design's life. Every mechanism is days of
# somebody's work, carried whether or not the thing it protects against happens.
# This one tracks what an engineer costs here rather than what a machine does,
# which is why it does not follow the index above.
build_per_service_month: 130

# How late is late. Course policy rather than a regional price, so it is the same
# everywhere. What being late *costs* is not here and is not anywhere: the bill
# counts what broke and refuses to invent a price for it.
sla_seconds: 10

# One second of the simulated clock is billed as one day of operation.
#
# A run is two minutes of an afternoon standing in for a system that runs
# continuously, and billed at its own length the whole cluster comes to four
# centimes — a bill nobody can read is a bill nobody argues with. The rates above
# are left alone so they stay checkable against a cloud's own price page; it is
# the clock that is scaled, and only where time is what is being paid for.
billed_days_per_second: 1
