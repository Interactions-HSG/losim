# The same cluster, with a retry policy on a method whose schema does not declare it
# safe to run twice. This scenario must be refused before anything runs.
seed: 5
job: WordCount

nodes:
  master:  { instance: m5.large, zone: eu-central-1a }
  m0:      { instance: c5.large, zone: eu-central-1a, runs: [Mapper] }
  r0:      { instance: r5.large, zone: eu-central-1a, runs: [Reducer] }
  umpire:  { instance: m5.large, zone: eu-central-1a, runs: [Volleyer] }

retries:
  - { method: lab.Volley.Hit, attempts: 3, backoff: 40 refMs }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  Mapper:
    Map: { fixed: 20 refMs }
    Note: { fixed: 1 refMs }
  Reducer:
    Fold: { fixed: 30 refMs }
  Volleyer:
    Hit: { fixed: 200 refMs }
