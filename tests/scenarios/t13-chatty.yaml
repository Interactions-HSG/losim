# The same ladder again, with a thousand reveal calls in every handler instead of one.
#
# This is the extreme case, and it is mandatory rather than thorough: at one reveal
# per handler an observer effect that halves a fitted exponent is undetectable. Every
# number stays plausible, nothing looks broken, and only the projection is wrong.
mode: scaled
seed: 13
job: Elastic
scale: 6

machines:
  master: { instance: m5.2xlarge, zone: eu-central-1a }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: [Chatty]

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
takes:
  Chatty:
    Map: { refMs: 2, refNsPerUnit: 360000 }
    Reduce: { refMs: 5 }
