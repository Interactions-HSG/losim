# The core claim, stated as a scenario: this is a forty-thousand-record job, and
# losim is to tell you what it does without ever running one that size.
#
# The engine climbs a ladder of four small runs, fits a law per resource against
# whatever that resource is actually a function of, and projects. What it is being
# checked against is t10-truth.yaml — the same cluster, the same code, the same
# corpus, run at full size for real.
mode: scaled
seed: 7
job: Elastic
scale: 6

nodes:
  master: { instance: m5.2xlarge, zone: eu-central-1a }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: [Combiner]

# The corpus, at full size. The job says what its input is made of; this
# says how much of each part there is.
input:
  lines:        48000
  wordsPerLine: 8
  vocabulary:   200000

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  Combiner:
    Map: { fixed: 2 refMs, perUnit: 360000 refNs }
    Reduce: { fixed: 5 refMs }
