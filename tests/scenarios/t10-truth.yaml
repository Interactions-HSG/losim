# What actually happens at the size t10.yaml is asked about.
#
# The same cluster, the same code, the same corpus — run at full size, for real, with
# nothing projected and nothing inferred. Every number this produces is what
# happened, which is the only thing a projection can honestly be checked against.
mode: direct
seed: 7
job: Elastic
scale: 6

nodes:
  master: { instance: m5.2xlarge, zone: eu-central-1a }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: { Worker: tests/systems/Combiner.java }

# The corpus, at full size. The job says what its input is made of; this
# says how much of each part there is.
input:
  lines:        48000
  wordsPerLine: 8
  vocabulary:   200000

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  tests/systems/Combiner.java:
    Map: { fixed: 2 refMs, perUnit: 360000 refNs }
    Reduce: { fixed: 5 refMs }
