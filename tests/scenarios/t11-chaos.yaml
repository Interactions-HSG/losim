# Four workers under a standing rate of failure rather than one scripted moment,
# and these ones do not come back. Failures are discrete and rare, so this is what
# a fleet's bad afternoon looks like on average rather than what one particular
# afternoon looked like — which is why the amplification term is fitted over
# several seeds rather than read off one run.
mode: scaled
seed: 11
job: Elastic
scale: 6

machines:
  master: { instance: m5.2xlarge, zone: eu-central-1a }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: [Combiner]

chaos:
  - { kill: { every: 900 refMs, among: workers } }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
takes:
  Combiner:
    Map: { refMs: 2, refNsPerRecord: 360000 }
    Reduce: { refMs: 5 }
