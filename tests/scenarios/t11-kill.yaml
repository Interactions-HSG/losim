# Four workers, one of which dies and comes back. Its chunks have to be done
# again somewhere, so a survivor absorbs its bucket — which is what a model fitted
# only on clean runs cannot see, and under-predicts optimistically.
seed: 11
scale: 6

nodes:
  master: { instance: m5.2xlarge, zone: eu-central-1a, runs: { losim.Job: tests/systems/Elastic.java } }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: { Worker: tests/systems/Combiner.java }
    overrides:
      w1:
        failures:
          - { kill: true, at: 400 refMs, restartAfter: 2 refSeconds }

# The corpus, at full size. One number, because there is one number the engine
# varies: what a line is made of is the Job's business, declared in its own code.
input:
  unit:  line
  count: 48000

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  tests/systems/Combiner.java:
    Map: { fixed: 2 refMs, perUnit: 360000 refNs }
    Reduce: { fixed: 5 refMs }
