# A bad afternoon. A mapper is killed mid-run and comes back; the rest of the pool
# is exposed to a standing rate of failure rather than one scripted moment. The job
# is expected to finish with the right answer anyway — that is the exercise.
seed: 5
job: WordCount
tightMargin: true

nodes:
  master: { instance: m5.large, zone: eu-central-1a }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b]
    runs: { Worker: tests/systems/Mapper.java }
    # A standing rate of failure rather than one scripted moment. Written on the
    # pool, so each of the four mappers draws its own afternoon — four streams at
    # one freeze per 2800 refMs is the same one-per-700 across the pool that this
    # was before failures moved inside the nodes they happen to.
    failures:
      - { freeze: true, per: 2800 refMs, for: 150 refMs }
    overrides:
      # Killed before its chunk is handed out, not while it holds one.
      #
      # This was `at: 300 refMs`, and the mappers are dispatched somewhere between
      # 266 and 379 depending on what setup cost that run — so the failure landed
      # inside the dispatch window and a coin flip decided the afternoon. Land
      # before it and m2 is dead when the work arrives: the calls fail, the
      # retries fire, the pool carries the chunk, and the run lasts long enough
      # for the standing rate to draw at all. Land after it and m2 has already
      # answered, killing it costs nothing, the job finishes in 400 refMs and no
      # drawn failure is ever due.
      #
      # Both are legitimate afternoons. Only one of them is the exercise this
      # simulation says it is, and one that is the exercise half the time is a
      # test that fails a sixth of the time for the least interesting reason
      # available.
      m2:
        failures:
          - { kill: true, at: 200 refMs, restartAfter: 2 refSeconds }
  reducers:
    count: 2
    prefix: r
    instance: r5.large
    zone: eu-central-1a
    runs: { Shuffler: tests/systems/Reducer.java }


# Map is declared NO_SIDE_EFFECTS in the .proto, so retrying it needs no argument.
retries:
  - { method: lab.Worker.Map, attempts: 3, backoff: 40 refMs, multiplier: 2 }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  tests/systems/Mapper.java:
    Map: { fixed: 20 refMs }
    Note: { fixed: 1 refMs }
  tests/systems/Reducer.java:
    Fold: { fixed: 30 refMs }
