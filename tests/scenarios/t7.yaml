# A bad afternoon. A mapper is killed mid-run and comes back; the rest of the pool
# is exposed to a standing rate of failure rather than one scripted moment. The job
# is expected to finish with the right answer anyway — that is the exercise.
seed: 5
job: WordCount
tightMargin: true

nodes:
  master: { instance: m5.large, zone: eu-central-1a }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b]
    runs: [Mapper]
  reducers:
    count: 2
    prefix: r
    instance: r5.large
    zone: eu-central-1a
    runs: [Reducer]

# Killed before its chunk is handed out, not while it holds one.
#
# This was `at: 300 refMs`, and the mappers are dispatched somewhere between 266
# and 379 depending on what setup cost that run — so the fault landed inside the
# dispatch window and a coin flip decided the afternoon. Land before it and m2 is
# dead when the work arrives: the calls fail, the retries fire, the pool carries
# the chunk, and the run lasts long enough for the standing rate of failure to
# draw at all. Land after it and m2 has already answered, killing it costs
# nothing, the job finishes in 400 refMs and no chaos is ever due.
#
# Both are legitimate afternoons. Only one of them is the exercise this scenario
# says it is, and a scenario that is the exercise half the time is a test that
# fails a sixth of the time for the least interesting reason available.
faults:
  - { at: 200 refMs, kill: m2, restart_after: 2 refSeconds }

chaos:
  - { freeze: { every: 700 refMs, among: mappers, for: 150 refMs } }

# Map is declared NO_SIDE_EFFECTS in the .proto, so retrying it needs no argument.
retries:
  - { method: lab.Worker.Map, attempts: 3, backoff: 40 refMs, multiplier: 2 }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  Mapper:
    Map: { fixed: 20 refMs }
    Note: { fixed: 1 refMs }
  Reducer:
    Fold: { fixed: 30 refMs }
