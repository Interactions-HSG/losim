# Eight workers. If the engine has folded the fleet dimension into the data
# dimension, this is the cell where it shows: a resource that is really a function
# of the data will look like a function of the fleet, and be wrong about both.
mode: scaled
seed: 11
job: Elastic
scale: 6

machines:
  master: { instance: m5.2xlarge, zone: eu-central-1a }
  workers:
    count: 8
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: [Combiner]


# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
takes:
  Combiner:
    Map: { refMs: 2, refNsPerRecord: 360000 }
    Reduce: { refMs: 5 }
