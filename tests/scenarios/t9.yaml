# The same pipeline again, for what the trace says about order rather than about
# results: a call stack that crosses machines, and concurrency reported as such.
seed: 8
job: WordCount

network: { sameZone: 15 refMs, crossZone: 60 refMs }

nodes:
  master: { instance: m5.large, zone: eu-central-1a }
  mappers:
    count: 3
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b]
    runs: { Worker: tests/systems/Mapper.java }
  reducers:
    count: 2
    prefix: r
    instance: r5.large
    zone: eu-central-1b
    runs: { Shuffler: tests/systems/Reducer.java }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  tests/systems/Mapper.java:
    Map: { fixed: 20 refMs }
    Note: { fixed: 1 refMs }
  tests/systems/Reducer.java:
    Fold: { fixed: 30 refMs }
