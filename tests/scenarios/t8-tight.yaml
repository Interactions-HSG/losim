# One reducer, holding every word, on a machine too small for the bucket it is
# given. Nothing here declares that it will fail: what it holds is whatever the
# heap walk finds it holding, so it fails for the reason a real one would.
seed: 2
job: WordCount

nodes:
  master: { instance: m5.large, zone: eu-central-1a }
  mappers: { count: 2, prefix: m, instance: c5.large, zone: eu-central-1a, runs: [Mapper] }
  r0:     { instance: r5.large, zone: eu-central-1a, runs: [Reducer], memoryMb: 4 }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  Mapper:
    Map: { fixed: 20 refMs }
    Note: { fixed: 1 refMs }
  Reducer:
    Fold: { fixed: 30 refMs }
