# Split, map, shuffle, reduce. Four mappers and two reducers, nothing going wrong:
# whatever this case reports is what the pipeline does when it is left alone.
seed: 2
job: WordCount

machines:
  master: { instance: m5.large, zone: eu-central-1a }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b]
    runs: [Mapper]
  reducers:
    count: 2
    prefix: r
    instance: r5.large
    zone: eu-central-1a
    runs: [Reducer]

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
takes:
  Mapper:
    Map: { refMs: 20 }
    Note: { refMs: 1 }
  Reducer:
    Fold: { refMs: 30 }
