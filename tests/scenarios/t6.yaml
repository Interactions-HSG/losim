# Split, map, shuffle, reduce. Four mappers and two reducers, nothing going wrong:
# whatever this case reports is what the pipeline does when it is left alone.
seed: 2

nodes:
  master: { instance: m5.large, zone: eu-central-1a, runs: { losim.Job: tests/systems/WordCount.java } }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b]
    runs: { Worker: tests/systems/Mapper.java }
  reducers:
    count: 2
    prefix: r
    instance: r5.large
    zone: eu-central-1a
    runs: { Shuffler: tests/systems/Reducer.java }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  tests/systems/Mapper.java:
    Map: { fixed: 20 refMs }
    Note: { fixed: 1 refMs }
  tests/systems/Reducer.java:
    Fold: { fixed: 30 refMs }
