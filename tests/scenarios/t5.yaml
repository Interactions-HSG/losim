# Eight calls costing 100 refMs each, into a machine with two vCPUs. Four waves,
# not one: the machine's executor is its vCPU model, and this is what says so.
seed: 1
job: Storm

nodes:
  client: { instance: m5.large, zone: eu-central-1a }
  srv:    { instance: m5.large, zone: eu-central-1a, runs: [Grinder] }   # 2 vCPU

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  Grinder:
    Map: { fixed: 100 refMs }
    Note: { fixed: 1 refMs }
