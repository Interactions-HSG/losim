# One ladder, fitted three times: with telemetry off, with it on but recording no
# payloads, and with every argument and every result rendered into the trace.
#
# What must come out the same is not the numbers — recording costs what it costs —
# but the fitted laws, because the laws are what ship. This file is run unchanged
# at each level; the only thing that differs is the --telemetry flag.
mode: scaled
seed: 13
job: Elastic
scale: 6

machines:
  master: { instance: m5.2xlarge, zone: eu-central-1a }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: [Combiner]

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
takes:
  Combiner:
    Map: { refMs: 2, refNsPerUnit: 360000 }
    Reduce: { refMs: 5 }
