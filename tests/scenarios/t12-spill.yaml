# A reducer that spills to disk once its bucket outgrows what it will hold in
# memory. Perfectly reasonable behaviour, and the exact thing an extrapolation must
# not be allowed to cross: below the threshold memory climbs with vocabulary, above
# it memory flattens and disk takes over. A law fitted below predicts a machine that
# fills up; a law fitted across predicts something that happened at neither end.
#
# The ladder is chosen to straddle the threshold, because a ladder entirely on one
# side of it would fit beautifully and be wrong about the other side.
mode: scaled
seed: 12
job: Elastic
scale: 6

nodes:
  master: { instance: m5.2xlarge, zone: eu-central-1a }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: [Spillover]

# The corpus, at full size. The job says what its input is made of; this
# says how much of each part there is.
input:
  lines:        48000
  wordsPerLine: 8
  vocabulary:   200000

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  Spillover:
    Map: { fixed: 2 refMs, perUnit: 360000 refNs }
    Reduce: { fixed: 5 refMs }
