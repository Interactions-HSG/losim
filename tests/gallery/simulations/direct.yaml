# The plain one. Four renderers, six thousand frames, nothing going wrong, and no
# scale: — so this is not a model of anything bigger. Every number in the trace is
# something that was measured while it happened.
#
# Start here. The others are this one with a single thing changed.
seed: 3

nodes:
  master:
    instance: m5.large
    zone:     eu-central-1a
    runs:     { losim.Job: tests/gallery/systems/RenderMaster.java }
  renderers:
    count:    4
    prefix:   r
    instance: c5.large
    zone:     eu-central-1a
    runs:     { Thumbnailer: tests/gallery/systems/Shrinker.java }

input:
  unit:  frame
  count: 6000

# What each rpc costs on the reference node, under the class that serves it. The
# handlers declare nothing: a duration is a claim about the hardware a design
# would run on, so it belongs here — and the Java stays plain gRPC with no losim
# in its signatures.
simulatedDuration:
  tests/gallery/systems/Shrinker.java:
    Thumbnail: { fixed: 3 refMs, perUnit: 240000 refNs }
    Totals:    { fixed: 5 refMs }
