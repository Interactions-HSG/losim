# 40000 units at 0.02 refMs each, asked for twice: once with 2000 refMs of
# patience and once with 600. The fixed cost is 2 refMs, so neither deadline looks
# wrong until the handler declares its count.
#
# This case turns on a margin: a run that flips between seeds is the margin
# being tight, not the simulator being broken.
seed: 1

nodes:
  client: { instance: m5.large, zone: eu-central-1a, runs: { dissaly.Job: tests/systems/Budget.java } }
  srv:    { instance: m5.large, zone: eu-central-1a, runs: { Worker: tests/systems/Steady.java } }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  tests/systems/Steady.java:
    Map: { fixed: 2 refMs, perUnit: 20000 refNs }
    Note: { fixed: 1 refMs }
