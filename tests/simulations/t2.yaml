# One client, one server, one unary call. Nothing else, on purpose: if this case
# ever fails, nothing further up the suite means anything.
seed: 1

nodes:
  client: { instance: m5.large, zone: eu-central-1a, runs: { dissaly.Job: tests/systems/OneCall.java } }
  srv:    { instance: m5.large, zone: eu-central-1a, runs: { Worker: tests/systems/Mapper.java } }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no dissaly in it.
simulatedDuration:
  tests/systems/Mapper.java:
    Map: { fixed: 20 refMs }
    Note: { fixed: 1 refMs }
