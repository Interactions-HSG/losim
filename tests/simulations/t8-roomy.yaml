# The same code and the same data, on a machine with room for it. The only
# given. Nothing here declares that it will fail: what it holds is whatever the
# heap walk finds it holding, so it fails for the reason a real one would.
seed: 2

nodes:
  master: { instance: m5.large, zone: eu-central-1a, runs: { dissaly.Job: tests/systems/WordCount.java } }
  mappers: { count: 2, prefix: m, instance: c5.large, zone: eu-central-1a, runs: { Worker: tests/systems/Mapper.java } }
  r0:     { instance: r5.large, zone: eu-central-1a, runs: { Shuffler: tests/systems/Reducer.java }, memoryMb: 64 }

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  tests/systems/Mapper.java:
    Map: { fixed: 20 refMs }
    Note: { fixed: 1 refMs }
  tests/systems/Reducer.java:
    Fold: { fixed: 30 refMs }
