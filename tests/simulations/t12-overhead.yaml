# The other way a ladder does not straightforwardly extrapolate: not a bend, but a
# cost that is not a cost of the workload at all.
#
# Every worker writes a fixed 64 MB index before it is any use. At probe scale that
# index is almost the whole disk figure, and the part that varies with the data is a
# rounding error on top of it. So the disk law is nearly flat, and six times the
# workload comes out at very nearly the same number — which is the true answer about
# this design and the useful one: whatever the index costs, a bigger run will not
# change it.
#
# This used to be refused. Four points that are all index were held to be unable to
# say what the data costs, and the engine declined to run at all. That was wrong in
# two ways. `fixed + c*n^beta` is a perfectly good law with a large constant in it,
# and the run it abandoned contained four other resources that fitted perfectly well.
# What it should say — and now does — is how far the answer travels between the two
# sizes, which is the thing that survives however the fit chose to split itself.
seed: 12
scale: 6

nodes:
  master: { instance: m5.2xlarge, zone: eu-central-1a, runs: { dissaly.Job: tests/systems/Elastic.java } }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: { Worker: tests/systems/Prefill.java }

# The corpus, at full size. One number, because there is one number the engine
# varies: what a line is made of is the Job's business, declared in its own code.
input:
  unit:  line
  count: 48000

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no dissaly in it.
simulatedDuration:
  tests/systems/Prefill.java:
    Map: { fixed: 2 refMs, perUnit: 360000 refNs }
    Reduce: { fixed: 5 refMs }
