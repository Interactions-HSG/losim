# Four workers under a standing rate of failure rather than one scripted moment,
# and these ones do not come back. Failures are discrete and rare, so this is what
# a cluster's bad afternoon looks like on average rather than what one particular
# afternoon looked like — which is why the amplification term is fitted over
# several seeds rather than read off one run.
seed: 11
scale: 6

nodes:
  master: { instance: m5.2xlarge, zone: eu-central-1a, runs: { dissaly.Job: tests/systems/Elastic.java } }
  workers:
    count: 4
    prefix: w
    instance: r5.large
    zone: eu-central-1a
    runs: { Worker: tests/systems/Combiner.java }
    # Each of the four draws its own, so one kill per 3600 refMs each is the one
    # per 900 across the pool this was before failures moved inside the nodes.
    failures:
      - { kill: true, per: 3600 refMs }

# The corpus, at full size. One number, because there is one number the engine
# varies: what a line is made of is the Job's business, declared in its own code.
input:
  unit:  line
  count: 48000

# What each rpc costs on the reference machine, under the class that serves it.
# The handlers declare nothing: a duration is a claim about the machine a design
# would run on, so it belongs to the scenario — and a system stays plain gRPC
# with no losim in it.
simulatedDuration:
  tests/systems/Combiner.java:
    Map: { fixed: 2 refMs, perUnit: 360000 refNs }
    Reduce: { fixed: 5 refMs }
