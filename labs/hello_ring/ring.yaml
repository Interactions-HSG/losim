# Lab 1 — once around the world. Style A: plain records, no schema.
name: hello-ring
seed: 1
run_until: 2s
codec: record

vms:
  ring:
    prefix: vm
    program: Hello
    instance: t3.nano
    count: 6                      # -> vm0 .. vm5

network:
  topology: ring
  latency: {mean: 20ms, stddev: 5ms}

invariants:
  - {name: token comes home, check: TokenComesHome}
