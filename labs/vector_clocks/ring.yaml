# Lab 3 — vector clocks, on the ring topology from lab 1.
name: vector-clocks
seed: 5
run_until: 5s
codec: proto
prices: ../prices/eu-central-1.yaml

vms:
  ring:
    prefix: vm
    program: Clocks
    instance: t3.small
    count: 4

network:
  topology: ring
  latency: {mean: 15ms, stddev: 4ms}

invariants:
  - {name: clocks respect causality, check: ClocksAreCausal}
