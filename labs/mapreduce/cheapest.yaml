# The cost lab: find the cheapest fleet that still gets the right answer.
# Everything below is data — no code is needed to explore the space.
name: wordcount-cheapest
seed: 42
run_until: 30s
codec: proto
prices: ../prices/eu-central-1.yaml
input: >
  the cat sat on the mat the dog sat on the log
  a cat and a dog and a bird the bird sang
  the cat watched the bird the dog watched the cat

vms:
  master:
    program: Master
    instance: m5.large
  workers:
    prefix: w
    programs: [Mapper, Reducer]
    instance: m5.large
    count: 4
    market: spot

network:
  latency: {mean: 20ms, stddev: 5ms}

invariants:
  - {name: no lost words,      check: NoLostWords}
  - {name: no double counting, check: NoDoubleCounting}

sweep:
  seed: [1..12]
  matrix:
    workers.instance: [t3.micro, m5.large, c5.xlarge]
    workers.count:    [2, 4, 8]
    workers.programs: [Mapper+Reducer, Mapper]   # combiner on / off
