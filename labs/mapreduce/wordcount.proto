// The contract, written before any code.
syntax = "proto3";

message Chunk  { string text = 1; }
message Pair   { string key = 1; int32 value = 2; }
message Pairs  { repeated Pair pairs = 1; }
message Counts { map<string, int32> counts = 1; }

service Mapper  { rpc Map    (Chunk) returns (Pairs);  }
service Reducer { rpc Reduce (Pairs) returns (Counts); }
