# Lab 2 — wordcount. Style B: the .proto is the contract, written first.
name: wordcount
seed: 42
run_until: 30s
codec: proto
prices: ../prices/eu-central-1.yaml
input: >
  the cat sat on the mat the dog sat on the log
  a cat and a dog and a bird the bird sang
  the cat watched the bird the dog watched the cat

vms:
  master:
    program: Master
    instance: m5.large
    availability_zone: eu-central-1a

  workers:                          # ONE pool, both roles — as in the paper.
    prefix: w
    programs: [Mapper, Reducer]     # a colocated Reducer IS the combiner
    instance: m5.large
    count: 6
    market: spot
    availability_zone: [eu-central-1a, eu-central-1b]
    overrides:
      w3: {instance: t3.micro}      # the deliberate straggler
      w5: {programs: [Mapper]}      # no local Reducer -> no combining here

network:
  topology: mesh
  latency: {mean: 20ms, stddev: 5ms}
  loss: 0.0

faults:
  - {at: 60ms,  degrade: w3, cpu: 0.1}        # straggler, mid-map
  - {at: 120ms, kill: w0}                     # just gone; the master must notice
  - {at: 200ms, spot_reclaim: w1, notice: 80ms}   # it was 70% cheaper for a reason

invariants:
  - {name: no lost words,      check: NoLostWords}
  - {name: no double counting, check: NoDoubleCounting}
