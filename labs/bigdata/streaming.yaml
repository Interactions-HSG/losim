# 1 TB across six machines. Nothing is materialised; the framework acts as if.
name: bigdata-streaming
seed: 3
run_until: 600s
codec: proto
prices: ../prices/eu-central-1.yaml

vms:
  planner:
    program: Planner
    instance: m5.large
  workers:
    prefix: w
    program: Cruncher
    instance: r5.xlarge          # 32 GB, 475 GB of local disk is NOT available here
    count: 6

network:
  latency: {mean: 10ms, stddev: 2ms}

invariants:
  - {name: every shard done, check: EveryShardDone}
