# The link is cut, and neither end is broken.
#
# s0 and m3 cannot reach each other. Both are alive, both are answering everybody
# else, and to s0 the fetch from m3 looks exactly like m3 being dead — the same
# deadline, the same absence of any explanation. So s0 reports the task lost, the
# master re-runs it somewhere reachable, and the run costs a map task for a
# machine that never stopped working.
#
# Healed halfway through, which is the other half of the lesson: by the time the
# link comes back the decision has already been made, and nothing undoes it.

seed: 55
kTime: 20
job: MapReduce
expectedRun: 60 refSeconds

workload: { records: 8000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b]
    serves: [MapMachine, Beacon]
  shufflers:
    count: 3
    prefix: s
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ShuffleMachine, Beacon]
  reducers:
    count: 3
    prefix: r
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ReduceMachine, Beacon]

faults:
  - { at: 1700 refMs, partition: [s0, m3] }
  - { at: 2200 refMs, partition: [s1, m0] }
  - { at: 4500 refMs, heal: [s0, m3] }

network: { sameZone: 1 refMs, crossZone: 12 refMs }
