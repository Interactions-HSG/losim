# All the money at the front of the pipeline, and none at the back.
#
# Four sixteen-core mappers and two small reducers, every machine on its own line.
# The map phase is over almost before it starts and then the whole fleet waits on
# two machines that were never given enough room to hold what four fast machines
# produced.
#
# It is the most common way a MapReduce is provisioned badly, because the map
# phase is the one that looks expensive: it reads all the data. The reduce phase
# reads less and holds more, and holding is the part that fails.

seed: 91
kTime: 20
job: MapReduce
expectedRun: 90 refSeconds

workload: { records: 9000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: c5.4xlarge, zone: eu-central-1a, serves: [MapMachine, Beacon] }
  m1: { instance: c5.4xlarge, zone: eu-central-1b, serves: [MapMachine, Beacon] }
  m2: { instance: c5.4xlarge, zone: eu-central-1c, serves: [MapMachine, Beacon] }
  m3: { instance: c5.4xlarge, zone: eu-central-1a, serves: [MapMachine, Beacon] }

  s0: { instance: t3.small,   zone: eu-central-1a, serves: [ShuffleMachine, Beacon], memoryMb: 220 }
  s1: { instance: t3.small,   zone: eu-central-1b, serves: [ShuffleMachine, Beacon], memoryMb: 220 }

  r0: { instance: t3.small,   zone: eu-central-1a, serves: [ReduceMachine, Beacon], memoryMb: 300 }
  r1: { instance: t3.small,   zone: eu-central-1b, serves: [ReduceMachine, Beacon], memoryMb: 300 }

network: { sameZone: 1 refMs, crossZone: 12 refMs }
