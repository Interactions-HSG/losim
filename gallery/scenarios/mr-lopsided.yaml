# Eight mappers feeding two reducers.
#
# R is not a free parameter: it is how many pieces the key space is cut into, and
# with two of them each shuffler holds half the vocabulary. The map phase is wide
# and quick, the shuffle is sixteen fetches into two machines, and the reduce is
# two calls carrying half a corpus each.
#
# This is the shape people reach for when they think of R as "how many reducers
# do I have" rather than as "how small do I need each bucket to be".

seed: 4
kTime: 20
job: MapReduce
expectedRun: 35 refSeconds

workload: { records: 9000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }
  mappers:
    count: 8
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [MapMachine, Beacon]
  shufflers:
    count: 2
    prefix: s
    instance: r5.xlarge
    zone: [eu-central-1a, eu-central-1b]
    serves: [ShuffleMachine, Beacon]
  reducers:
    count: 2
    prefix: r
    instance: r5.xlarge
    zone: [eu-central-1a, eu-central-1b]
    serves: [ReduceMachine, Beacon]

network: { sameZone: 1 refMs, crossZone: 12 refMs, jitter: 2 refMs }
