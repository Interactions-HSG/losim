# The classic shape: no shufflers at all.
#
# The reducers do their own fetching, which is how the paper describes it and how
# Hadoop runs it. There is no third role and no extra hop — the reduce machine
# pulls region p from every mapper itself, sorts it, and folds it.
#
# Diff this against mr-classic. The work is identical and the fleet is one column
# shorter; what moves is *where* the memory goes, because the machine that groups
# is now the machine that also holds the answer.

seed: 3
kTime: 20
job: MapReduce
expectedRun: 25 refSeconds

workload: { records: 6000 }

machines:
  master:   { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [MapMachine, Beacon]
  reducers:
    count: 3
    prefix: r
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    # Serving both is what makes this the fused shape: the same machine answers
    # the fetch and the fold, so the master never places a shuffle at all.
    serves: [ShuffleMachine, ReduceMachine, Beacon]

network: { sameZone: 1 refMs, crossZone: 12 refMs, jitter: 2 refMs }
