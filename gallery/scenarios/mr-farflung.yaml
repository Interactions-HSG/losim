# Three zones, and a shuffle that has to cross all of them.
#
# Every machine on its own line so the geography is readable: the mappers are
# spread evenly, and so are the shufflers, which means most of the R×M fetches in
# phase (7) are between zones however cleverly they are placed. There is no
# locality to exploit when the data is genuinely everywhere.
#
# The shuffle stops being a step and becomes the run. Compare the phase durations
# with mr-classic's — the map and reduce phases are unchanged, and the middle of
# the run is four times longer.

seed: 61
kTime: 20
job: MapReduce
expectedRun: 90 refSeconds

workload: { records: 8000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: c5.large, zone: eu-central-1a, serves: [MapMachine, Beacon] }
  m1: { instance: c5.large, zone: eu-central-1b, serves: [MapMachine, Beacon] }
  m2: { instance: c5.large, zone: eu-central-1c, serves: [MapMachine, Beacon] }
  m3: { instance: c5.large, zone: eu-central-1b, serves: [MapMachine, Beacon] }
  m4: { instance: c5.large, zone: eu-central-1c, serves: [MapMachine, Beacon] }
  m5: { instance: c5.large, zone: eu-central-1a, serves: [MapMachine, Beacon] }

  s0: { instance: r5.large, zone: eu-central-1a, serves: [ShuffleMachine, Beacon] }
  s1: { instance: r5.large, zone: eu-central-1b, serves: [ShuffleMachine, Beacon] }
  s2: { instance: r5.large, zone: eu-central-1c, serves: [ShuffleMachine, Beacon] }

  r0: { instance: r5.large, zone: eu-central-1a, serves: [ReduceMachine, Beacon] }
  r1: { instance: r5.large, zone: eu-central-1b, serves: [ReduceMachine, Beacon] }
  r2: { instance: r5.large, zone: eu-central-1c, serves: [ReduceMachine, Beacon] }

network:
  sameZone: 1 refMs
  crossZone: 90 refMs        # a different continent, not a different rack
  jitter: 12 refMs
