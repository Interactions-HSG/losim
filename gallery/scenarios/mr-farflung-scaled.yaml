# mr-farflung, scaled: 8,000 lines run, 4,800,000 projected.
#
# The direct twin runs what it declares. This one declares a workload no laptop
# can hold and hands the problem to the engine: a ladder of four sizes, one law
# fitted per resource against the variable that resource is actually a function
# of, and then a run size, a compression factor and a per-machine cap solved so
# that demand over capacity is what it would be at 4,800,000 lines.
#
# A declared cap is not ignored: it is read as this machine's size at full scale
# and shrunk by the same ratio as the workload, so a machine deliberately made
# too small stays proportionally too small.
#
# What the direct twin shows, unchanged below:
# Three zones, and a shuffle that has to cross all of them
#
# What to read: the cross-zone line on the bill. In a direct run the egress is a
# rounding error and every design looks equally cheap; projected, it is a number
# somebody has to approve. That is the whole argument for projecting at all.
#
# Anything the engine could not fit to its own satisfaction is absent from the
# projection, with the reason beside it — the only honest way to report a law
# whose exponent moves further than the effect it is being asked to measure.
#
# Every machine here is declared on its own, which changes what the grid can vary.
# Resizing the fleet means regenerating a pool, and a pool of one is left alone —
# so the fleet dimension is flat for this scenario and the projection describes
# this fleet at this shape rather than the family of shapes it belongs to. That is
# a real limit and it is stated here rather than discovered in the numbers.

mode: scaled
seed: 61
kTime: 20
job: MapReduce
expectedRun: 90 refSeconds

workload:
  records: 4800000     # full scale: what this design is really for
  probe: [640, 1280, 2640, 5280]
  fleets: [2, 4]      # varied apart from the data, so a resource can be
                      # attributed to the right one

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: c5.large, zone: eu-central-1a, serves: [MapMachine, Beacon] }
  m1: { instance: c5.large, zone: eu-central-1b, serves: [MapMachine, Beacon] }
  m2: { instance: c5.large, zone: eu-central-1c, serves: [MapMachine, Beacon] }
  m3: { instance: c5.large, zone: eu-central-1b, serves: [MapMachine, Beacon] }
  m4: { instance: c5.large, zone: eu-central-1c, serves: [MapMachine, Beacon] }
  m5: { instance: c5.large, zone: eu-central-1a, serves: [MapMachine, Beacon] }

  s0: { instance: r5.large, zone: eu-central-1a, serves: [ShuffleMachine, Beacon] }
  s1: { instance: r5.large, zone: eu-central-1b, serves: [ShuffleMachine, Beacon] }
  s2: { instance: r5.large, zone: eu-central-1c, serves: [ShuffleMachine, Beacon] }

  r0: { instance: r5.large, zone: eu-central-1a, serves: [ReduceMachine, Beacon] }
  r1: { instance: r5.large, zone: eu-central-1b, serves: [ReduceMachine, Beacon] }
  r2: { instance: r5.large, zone: eu-central-1c, serves: [ReduceMachine, Beacon] }

network:
  sameZone: 1 refMs
  crossZone: 90 refMs        # a different continent, not a different rack
  jitter: 12 refMs
