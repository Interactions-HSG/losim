# The same graph, ten rounds instead of four.
#
# This is the experiment, and it is the answer to question 4.4 of the assignment:
# is MapReduce suitable for iterative algorithms? Divide this run's disk and
# network by pr-classic's. The arithmetic is identical per round — one division
# and one addition per link — and everything else is multiplied by the number of
# rounds, because MapReduce keeps no state between them and the whole graph is
# re-read, re-written and re-shuffled every single time.
#
# Nothing fails. That is what makes it the good argument: the design is not
# fragile, it is just paying for the same thing over and over.

seed: 71
kTime: 25
job: PageRankLong
expectedRun: 150 refSeconds

workload: { records: 900 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [RankMapMachine, Beacon]
  reducers:
    count: 3
    prefix: r
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [RankReduceMachine, Beacon]

network: { sameZone: 1 refMs, crossZone: 12 refMs, jitter: 2 refMs }
