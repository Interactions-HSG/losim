# A fleet of burstables, which is a fleet that is fast until it is not.
#
# Every machine here is a t3, and a t3 has a baseline it falls back to once its
# credits are gone — a fifth of its rated speed for the nano, a fifth for the
# micro. losim's catalogue knows this, which means these machines are not simply
# "small": they are small in a way that changes partway through a long run.
#
# Written out one by one because the sizes matter individually and the master is
# proportioning work by them.

seed: 96
kTime: 15
job: MapReduce
expectedRun: 120 refSeconds

workload: { records: 12000 }

machines:
  master: { instance: t3.medium, zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: t3.nano,   zone: eu-central-1a, serves: [MapMachine, Beacon] }
  m1: { instance: t3.micro,  zone: eu-central-1b, serves: [MapMachine, Beacon] }
  m2: { instance: t3.small,  zone: eu-central-1c, serves: [MapMachine, Beacon] }
  m3: { instance: t3.medium, zone: eu-central-1a, serves: [MapMachine, Beacon] }
  m4: { instance: t3.medium, zone: eu-central-1b, serves: [MapMachine, Beacon] }

  s0: { instance: t3.medium, zone: eu-central-1a, serves: [ShuffleMachine, Beacon] }
  s1: { instance: t3.medium, zone: eu-central-1c, serves: [ShuffleMachine, Beacon] }

  r0: { instance: t3.medium, zone: eu-central-1a, serves: [ReduceMachine, Beacon] }
  r1: { instance: t3.medium, zone: eu-central-1b, serves: [ReduceMachine, Beacon] }

faults:
  # What running out of credits looks like: no failure, just slower, permanently.
  - { at: 3000 refMs, degrade: m0, factor: 5 }
  - { at: 3000 refMs, degrade: m1, factor: 5 }
  - { at: 4500 refMs, degrade: m2, factor: 5 }

network: { sameZone: 2 refMs, crossZone: 16 refMs, jitter: 5 refMs }
