# mr-frugal, scaled: 5,000 lines run, 400,000 projected.
#
# The direct twin runs what it declares. This one declares a workload no laptop
# can hold and hands the problem to the engine: a ladder of four sizes, one law
# fitted per resource against the variable that resource is actually a function
# of, and then a run size, a compression factor and a per-machine cap solved so
# that demand over capacity is what it would be at 400,000 lines.
#
# A declared cap is not ignored: it is read as this machine's size at full scale
# and shrunk by the same ratio as the workload, so a machine deliberately made
# too small stays proportionally too small.
#
# What the direct twin shows, unchanged below:
# Nothing but small machines, and every one of them written out
#
# What to read: the caps, and then the events. A declared cap is not ignored here
# — it is the *full-scale* size of that machine, shrunk by the same ratio as the
# workload, so a machine deliberately made too small stays proportionally too
# small. The failure it produces is therefore a projection of a real one rather
# than an artefact of the shrinking.
#
# Anything the engine could not fit to its own satisfaction is absent from the
# projection, with the reason beside it — the only honest way to report a law
# whose exponent moves further than the effect it is being asked to measure.
#
# Every machine here is declared on its own, which changes what the grid can vary.
# Resizing the fleet means regenerating a pool, and a pool of one is left alone —
# so the fleet dimension is flat for this scenario and the projection describes
# this fleet at this shape rather than the family of shapes it belongs to. That is
# a real limit and it is stated here rather than discovered in the numbers.

mode: scaled
seed: 15
kTime: 15
job: MapReduce
expectedRun: 45 refSeconds

workload:
  records: 400000      # full scale: what this design is really for
  probe: [400, 800, 1650, 3300]
  fleets: [2, 4]      # varied apart from the data, so a resource can be
                      # attributed to the right one

machines:
  master: { instance: t3.medium, zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: t3.nano,   zone: eu-central-1a, serves: [MapMachine, Beacon], diskMb: 6 }
  m1: { instance: t3.micro,  zone: eu-central-1b, serves: [MapMachine, Beacon], diskMb: 6 }
  m2: { instance: t3.small,  zone: eu-central-1c, serves: [MapMachine, Beacon], diskMb: 6 }
  m3: { instance: t3.medium, zone: eu-central-1a, serves: [MapMachine, Beacon], diskMb: 6 }

  s0: { instance: t3.medium, zone: eu-central-1a, serves: [ShuffleMachine, Beacon], memoryMb: 700 }
  s1: { instance: t3.medium, zone: eu-central-1b, serves: [ShuffleMachine, Beacon], memoryMb: 700 }

  r0: { instance: t3.small,  zone: eu-central-1a, serves: [ReduceMachine, Beacon], memoryMb: 400 }
  r1: { instance: t3.small,  zone: eu-central-1b, serves: [ReduceMachine, Beacon], memoryMb: 400 }

network: { sameZone: 2 refMs, crossZone: 14 refMs, jitter: 4 refMs }
