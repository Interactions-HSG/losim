# Killed, and back two seconds later — with an empty disk.
#
# A restarted machine comes back with fresh services, which is what a real one
# does: the process is new, and everything the old process had on its local disk
# is not addressable by the new one. So m2 answers the shuffle perfectly happily
# and truthfully says it has no idea what region 3 is.
#
# That is worse than staying dead, in one specific way: a dead machine is not in
# `serving()` and gets no more work, while a restarted empty one looks healthy and
# is a perfectly good place to put the re-run. Which it is. It just cannot help
# with anything it did before.

seed: 33
kTime: 20
job: MapReduce
expectedRun: 60 refSeconds

workload: { records: 8000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b]
    serves: [MapMachine, Beacon]
  shufflers:
    count: 3
    prefix: s
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ShuffleMachine, Beacon]
  reducers:
    count: 3
    prefix: r
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ReduceMachine, Beacon]

faults:
  - { at: 1850 refMs, kill: m2, restart_after: 700 refMs }

network: { sameZone: 1 refMs, crossZone: 12 refMs }
