# mr-fused, scaled: 6,000 lines run, 900,000 projected.
#
# The direct twin runs what it declares. This one declares a workload no laptop
# can hold and hands the problem to the engine: a ladder of four sizes, one law
# fitted per resource against the variable that resource is actually a function
# of, and then a run size, a compression factor and a per-machine cap solved so
# that demand over capacity is what it would be at 900,000 lines.
#
# A declared cap is not ignored: it is read as this machine's size at full scale
# and shrunk by the same ratio as the workload, so a machine deliberately made
# too small stays proportionally too small.
#
# What the direct twin shows, unchanged below:
# The classic shape: no shufflers at all
#
# What to read: the fitted laws. Each resource is fitted against the variable it
# is actually a function of, and the interesting result is that they are not the
# same variable — memory tracks distinct keys, which saturate, and disk tracks
# words emitted, which do not. A projection that fitted both against "records"
# would look just as confident and would not survive a change of corpus.
#
# Anything the engine could not fit to its own satisfaction is absent from the
# projection, with the reason beside it — the only honest way to report a law
# whose exponent moves further than the effect it is being asked to measure.

mode: scaled
seed: 3
kTime: 20
job: MapReduce
expectedRun: 25 refSeconds

workload:
  records: 900000      # full scale: what this design is really for
  probe: [480, 960, 1980, 3960]
  fleets: [2, 4]      # varied apart from the data, so a resource can be
                      # attributed to the right one

machines:
  master:   { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [MapMachine, Beacon]
  reducers:
    count: 3
    prefix: r
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    # Serving both is what makes this the fused shape: the same machine answers
    # the fetch and the fold, so the master never places a shuffle at all.
    serves: [ShuffleMachine, ReduceMachine, Beacon]

network: { sameZone: 1 refMs, crossZone: 12 refMs, jitter: 2 refMs }
