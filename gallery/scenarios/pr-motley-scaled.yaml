# pr-motley, scaled: 1,000 pages run, 400,000 projected.
#
# The direct twin runs what it declares. This one declares a workload no laptop
# can hold and hands the problem to the engine: a ladder of four sizes, one law
# fitted per resource against the variable that resource is actually a function
# of, and then a run size, a compression factor and a per-machine cap solved so
# that demand over capacity is what it would be at 400,000 pages.
#
# A declared cap is not ignored: it is read as this machine's size at full scale
# and shrunk by the same ratio as the workload, so a machine deliberately made
# too small stays proportionally too small.
#
# What the direct twin shows, unchanged below:
# PageRank on a fleet where no two machines are alike
#
# What to read: the disk, multiplied by the iteration count. MapReduce keeps no
# state between rounds, so the whole graph is re-written every one of them — and
# the projection multiplies a per-round law by a number of rounds nobody scaled.
# That compounding is the answer to whether this model suits iterative work.
#
# Anything the engine could not fit to its own satisfaction is absent from the
# projection, with the reason beside it — the only honest way to report a law
# whose exponent moves further than the effect it is being asked to measure.
#
# Every machine here is declared on its own, which changes what the grid can vary.
# Resizing the fleet means regenerating a pool, and a pool of one is left alone —
# so the fleet dimension is flat for this scenario and the projection describes
# this fleet at this shape rather than the family of shapes it belongs to. That is
# a real limit and it is stated here rather than discovered in the numbers.

mode: scaled
seed: 98
kTime: 30
job: PageRankLong
expectedRun: 200 refSeconds

workload:
  records: 400000      # full scale: what this design is really for
  probe: [140, 280, 550, 1000]
  fleets: [2, 4]      # varied apart from the data, so a resource can be
                      # attributed to the right one

machines:
  master: { instance: m5.xlarge,  zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: t3.micro,   zone: eu-central-1a, serves: [RankMapMachine, Beacon] }
  m1: { instance: t3.medium,  zone: eu-central-1b, serves: [RankMapMachine, Beacon] }
  m2: { instance: c5.large,   zone: eu-central-1c, serves: [RankMapMachine, Beacon], diskMb: 0.35 }
  m3: { instance: c5.xlarge,  zone: eu-central-1a, serves: [RankMapMachine, Beacon] }
  m4: { instance: c5.4xlarge, zone: eu-central-1b, serves: [RankMapMachine, Beacon] }

  r0: { instance: r5.large,   zone: eu-central-1c, serves: [RankReduceMachine, Beacon] }
  r1: { instance: r5.xlarge,  zone: eu-central-1a, serves: [RankReduceMachine, Beacon] }
  r2: { instance: m5.large,   zone: eu-central-1b, serves: [RankReduceMachine, Beacon] }
  r3: { instance: i3.large,   zone: eu-central-1c, serves: [RankReduceMachine, Beacon] }

network: { sameZone: 1 refMs, crossZone: 15 refMs, jitter: 4 refMs }
