# mr-locality, choosing shufflers by partition number instead of by zone.
#
# The identical fleet, the identical corpus, the identical weather. The census is
# still taken and then discarded: partition p is grouped on shuffler p, which
# lands two of the three in eu-central-1c while every byte they need is sitting
# in eu-central-1a.
#
# Nothing fails. The job is correct, finishes, and drags most of the intermediate
# data across a zone boundary to do it. Subtract the cross-zone lines from
# mr-locality's bill: that difference is what data locality is worth, and it is
# the answer to question 4.3 written in currency.

seed: 12
kTime: 20
job: MapReduceBlind
expectedRun: 60 refSeconds

workload: { records: 8000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }

  mappers:
    count: 6
    prefix: m
    instance: c5.large
    zone: eu-central-1a               # all of the data, in one place
    serves: [MapMachine, Beacon]

  # Six candidates for three partitions. The zones alternate, so position and
  # locality disagree — which is the entire experiment.
  s0: { instance: r5.large, zone: eu-central-1c, serves: [ShuffleMachine, Beacon] }
  s1: { instance: r5.large, zone: eu-central-1a, serves: [ShuffleMachine, Beacon] }
  s2: { instance: r5.large, zone: eu-central-1c, serves: [ShuffleMachine, Beacon] }
  s3: { instance: r5.large, zone: eu-central-1a, serves: [ShuffleMachine, Beacon] }
  s4: { instance: r5.large, zone: eu-central-1b, serves: [ShuffleMachine, Beacon] }
  s5: { instance: r5.large, zone: eu-central-1a, serves: [ShuffleMachine, Beacon] }

  reducers:
    count: 3
    prefix: r
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ReduceMachine, Beacon]

network:
  sameZone: 1 refMs
  crossZone: 25 refMs                 # deliberately harsh, so the choice is legible
  jitter: 3 refMs
