# No faults at all. Just a network that drops things.
#
# Nothing is killed, frozen, degraded or partitioned. Five percent of packets are
# lost and the jitter is a third of the cross-zone latency, and that alone is
# enough to make calls fail, deadlines pass and map tasks be redone.
#
# Worth running against mr-classic, because it is the scenario people forget: a
# fleet of perfectly healthy machines on a mediocre network produces a trace that
# looks like a fleet with a fault schedule.

seed: 57
kTime: 20
job: MapReduce
expectedRun: 70 refSeconds

workload: { records: 8000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }
  mappers:
    count: 5
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [MapMachine, Beacon]
  shufflers:
    count: 3
    prefix: s
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ShuffleMachine, Beacon]
  reducers:
    count: 3
    prefix: r
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ReduceMachine, Beacon]

network:
  sameZone: 2 refMs
  crossZone: 18 refMs
  jitter: 6 refMs
  loss: 0.05          # one call in twenty simply does not arrive
