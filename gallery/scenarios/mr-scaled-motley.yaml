# Scaled mode, on a fleet where every machine is a different machine.
#
# This is the one that uses the engine rather than the simulator. The workload
# declares a full scale nobody could run on a laptop, and losim fits a law for
# every resource from a ladder of small runs, then solves for a run size, a
# compression factor and a per-machine cap such that demand ÷ capacity is what it
# would be at full scale.
#
# Every machine is written out, with its own instance type, its own zone and its
# own size, because that is the hard case for the solve: the caps are not one
# number divided by one factor. Memory is fitted against distinct keys, which grow
# sublinearly, and disk against volume, which does not — so the two shrink by
# different amounts, on eleven machines that started at eleven different sizes.
#
# The bill is where this pays off. A direct run's egress is a rounding error; the
# projection is a number somebody has to approve.

mode: scaled
seed: 101
kTime: 30
job: MapReduce
expectedRun: 60 refSeconds

workload:
  records: 4000000            # full scale: four million lines
  probe: [500, 1000, 2000, 4000]
  fleets: [2, 4]

machines:
  master: { instance: m5.2xlarge, zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: t3.medium,  zone: eu-central-1a, serves: [MapMachine, Beacon] }
  m1: { instance: c5.large,   zone: eu-central-1b, serves: [MapMachine, Beacon] }
  m2: { instance: c5.xlarge,  zone: eu-central-1c, serves: [MapMachine, Beacon] }
  m3: { instance: c5.4xlarge, zone: eu-central-1a, serves: [MapMachine, Beacon] }

  s0: { instance: r5.large,   zone: eu-central-1a, serves: [ShuffleMachine, Beacon] }
  s1: { instance: r5.xlarge,  zone: eu-central-1b, serves: [ShuffleMachine, Beacon] }
  s2: { instance: i3.large,   zone: eu-central-1c, serves: [ShuffleMachine, Beacon] }

  r0: { instance: m5.xlarge,  zone: eu-central-1a, serves: [ReduceMachine, Beacon] }
  r1: { instance: r5.large,   zone: eu-central-1b, serves: [ReduceMachine, Beacon] }
  r2: { instance: m5.large,   zone: eu-central-1c, serves: [ReduceMachine, Beacon] }

network: { sameZone: 1 refMs, crossZone: 14 refMs, jitter: 3 refMs }
