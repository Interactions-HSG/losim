# The other way round, and it is not symmetric.
#
# Small mappers, big reducers. The map phase is slow — four two-core burstables
# reading nine thousand lines between them — and then everything downstream is
# over immediately, because the reducers have far more room than they need.
#
# Worth running against mr-bigmap-smallreduce. Both are badly provisioned; one is
# merely slow and the other falls over, and the difference is that being short of
# *time* at the front costs you time, while being short of *room* at the back
# costs you the job.

seed: 92
kTime: 20
job: MapReduce
expectedRun: 90 refSeconds

workload: { records: 9000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: t3.nano,   zone: eu-central-1a, serves: [MapMachine, Beacon] }
  m1: { instance: t3.micro,  zone: eu-central-1b, serves: [MapMachine, Beacon] }
  m2: { instance: t3.small,  zone: eu-central-1c, serves: [MapMachine, Beacon] }
  m3: { instance: t3.small,  zone: eu-central-1a, serves: [MapMachine, Beacon] }

  s0: { instance: r5.xlarge, zone: eu-central-1a, serves: [ShuffleMachine, Beacon] }
  s1: { instance: r5.xlarge, zone: eu-central-1b, serves: [ShuffleMachine, Beacon] }

  r0: { instance: r5.xlarge, zone: eu-central-1a, serves: [ReduceMachine, Beacon] }
  r1: { instance: r5.xlarge, zone: eu-central-1b, serves: [ReduceMachine, Beacon] }

network: { sameZone: 1 refMs, crossZone: 12 refMs }
