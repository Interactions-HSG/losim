# The output file does not fit.
#
# Phase (10) is the least interesting line in the reducer and the one that ends
# the job: a partition is folded correctly, in memory, and then cannot be written.
# There is no partial credit — a partition that was not written is a job that did
# not finish, which is a different outcome from a job that finished wrongly, and a
# simulator that rounded one into the other would be no use for deciding anything.
#
# The mappers have plenty of room. Only the last step is short.

seed: 22
kTime: 20
job: MapReduce
expectedRun: 50 refSeconds

workload: { records: 10000 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }
  mappers:
    count: 4
    prefix: m
    instance: c5.large
    zone: [eu-central-1a, eu-central-1b]
    serves: [MapMachine, Beacon]
  shufflers:
    count: 3
    prefix: s
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ShuffleMachine, Beacon]
  reducers:
    count: 3
    prefix: r
    instance: r5.large
    zone: [eu-central-1a, eu-central-1b, eu-central-1c]
    serves: [ReduceMachine, Beacon]
    overrides:
      r1: { diskMb: 0.02 }      # room for a few hundred keys, and no more
