# Ten rounds, on machines with the disk four rounds would have needed.
#
# Every machine on its own line, with its own volume, because the point is which
# of them fills first and when. Nothing accumulates in memory here — each round
# replaces the last — but the disk does, because every iteration writes the whole
# graph again and nothing ever deletes the previous one.
#
# So this run works, and works, and works, and then stops working somewhere in the
# middle for a reason that has nothing to do with the data getting bigger. That is
# the failure mode iteration on MapReduce actually has.

seed: 73
kTime: 25
job: PageRankLong
expectedRun: 150 refSeconds

workload: { records: 900 }

machines:
  master: { instance: m5.large, zone: eu-central-1a, serves: [Watchtower] }

  m0: { instance: c5.large,  zone: eu-central-1a, serves: [RankMapMachine, Beacon], diskMb: 0.22 }
  m1: { instance: c5.xlarge, zone: eu-central-1b, serves: [RankMapMachine, Beacon], diskMb: 0.22 }
  m2: { instance: c5.large,  zone: eu-central-1c, serves: [RankMapMachine, Beacon], diskMb: 3 }
  m3: { instance: c5.large,  zone: eu-central-1a, serves: [RankMapMachine, Beacon], diskMb: 3 }

  r0: { instance: r5.large,  zone: eu-central-1a, serves: [RankReduceMachine, Beacon] }
  r1: { instance: r5.large,  zone: eu-central-1b, serves: [RankReduceMachine, Beacon] }
  r2: { instance: m5.large,  zone: eu-central-1c, serves: [RankReduceMachine, Beacon] }

network: { sameZone: 1 refMs, crossZone: 12 refMs, jitter: 2 refMs }
