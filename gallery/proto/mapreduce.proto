// MapReduce, all of it, as a contract between machines.
//
// The 2025 assignment stops at map and reduce because that is the lesson it is
// teaching. The phases it leaves implicit are exactly the ones a distributed
// system lives or dies by, and every one of them is a place a machine can run
// out of something:
//
//   (1) split         the master cuts the input into M pieces
//   (2) assign        it hands a piece to a map worker
//   (3) read          the worker reads its split
//   (4) map           emit one pair per word — duplicates and all
//   (5) combine       sum locally, because addition is associative
//   (6) local write   partition into R regions, on the worker's own disk
//   (7) remote read   a shuffler pulls region p from every map worker
//   (8) sort          group by key, in the shuffler's memory
//   (9) reduce        add up what shares a key
//  (10) write         one output file per partition
//
// (6) and (10) are where a disk fills. (8) is where a machine runs out of
// memory. (7) is the only step that crosses zones, and the only one where a
// machine calls another machine directly rather than being told what to do —
// which is what makes a dead map worker expensive: its local disk went with it,
// so its map task has to be run again even though it had already finished.

syntax = "proto3";

package mr;

option java_package = "mr.pb";
option java_multiple_files = true;

message Empty {}

enum Phase {
  PHASE_UNKNOWN = 0;
  MAP           = 1;
  SHUFFLE       = 2;
  REDUCE        = 3;
}

// ------------------------------------------------------------------ (1)(2)(3)

// A piece of the input, and what the worker is to do with it. `parts` is R: the
// number of regions the map output is cut into, which is fixed before any map
// task runs because a reducer has to know where to look.
message Split {
  int32  task  = 1;
  string text  = 2;
  int32  lines = 3;
  int32  parts = 4;
}

// --------------------------------------------------------------------- (4)(5)

// Pairs, not a map. That is the whole shape of the exercise: the mapper emits
// duplicates and somebody downstream has to add them up.
message Pair  { string key = 1; int32 value = 2; }
message Pairs { repeated Pair pairs = 1; }

// ------------------------------------------------------------------------ (6)

// What one map task left on one worker's local disk.
message Region  { int32 task = 1; int32 part = 2; int32 pairs = 3; int64 bytes = 4; }

message MapDone {
  int32           task    = 1;
  string          worker  = 2;
  repeated Region regions = 3;
  int32           emitted = 4;   // before the combiner
  int32           kept    = 5;   // after it
}

// ------------------------------------------------------------------------ (7)

// One region, read off the disk of the worker that wrote it. Named for what it
// asks for rather than for the method that asks: `rpc Pull (Pull)` does not
// resolve, and a schema that needs you to know that is a schema with a trap in it.
message Fetch { int32 task = 1; int32 part = 2; int32 iteration = 3; }

// What a shuffler is told to gather: partition p, from these workers, for these
// map tasks. It does the reading itself — the master does not relay the data.
message Gather {
  int32           part    = 1;
  repeated string holders = 2;
  repeated int32  tasks   = 3;
}

// --------------------------------------------------------------------- (8)(9)

message Bucket {
  int32         part     = 1;
  repeated Pair pairs    = 2;
  int32         distinct = 3;

  // The map tasks this shuffler could not read, because the machine that wrote
  // them is not the machine that is there now. Returned rather than thrown: a
  // fetch failure is not an error in the shuffler, it is news about the map
  // phase, and the master is the only one who can act on it. Spark calls this a
  // FetchFailure and does the same thing with it — re-runs the map stage.
  repeated int32 lost = 4;
}

message Output {
  int32              part   = 1;
  int32              keys   = 2;
  int64              bytes  = 3;
  map<string, int32> counts = 4;
}

// ---------------------------------------------------------------------- aside

// A machine's own account of what went wrong, sent to the master and not waited
// for. An enum and a oneof, so that rendering a payload has something to get
// wrong.
message Trouble {
  Phase  phase  = 1;
  string worker = 2;
  oneof what {
    string message = 3;
    int64  code    = 4;
  }
  repeated string tags = 5;
}

// ------------------------------------------------------------------- capacity

// What a machine says it is made of, when asked.
//
// Asked, and not looked up. A real process can read its own cores, its own
// memory ceiling and its own availability zone without a network, and cannot
// read anybody else's at all — so an orchestrator that wants to send small work
// to small machines has to call and ask. That is why a resource manager has a
// registration endpoint, and it is why this table is stale the moment it is
// built: every machine in it may already be gone.
message Power {
  string machine  = 1;
  string instance = 2;
  string zone     = 3;
  int32  vcpu     = 4;
  double memoryMb = 5;
  double diskMb   = 6;
}

// -------------------------------------------------------------------- machines

// Offered by every machine that does work, alongside whatever else it serves.
// Separate from the working services on purpose: what a machine *is* and what a
// machine *does* are different questions, and only one of them changes when the
// job does.
service Roster {
  rpc Capacity (Empty) returns (Power) { option idempotency_level = NO_SIDE_EFFECTS; }
}

service MapWorker {
  // Safe to run twice, and it has to be: a worker that dies takes its local disk
  // with it, so its map task is re-run somewhere else. That is not an optimisation.
  rpc Map  (Split) returns (MapDone) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc Pull (Fetch) returns (Pairs)   { option idempotency_level = NO_SIDE_EFFECTS; }
}

service ShuffleWorker {
  rpc Sort (Gather) returns (Bucket) { option idempotency_level = NO_SIDE_EFFECTS; }
}

service ReduceWorker {
  rpc Reduce (Bucket) returns (Output) { option idempotency_level = NO_SIDE_EFFECTS; }

  // Deliberately not declared idempotent: committing an output file twice is a
  // real decision with a real consequence, and a scenario that retries this has
  // to say `unsafe: true` out loud.
  rpc Commit (Output) returns (Empty);
}

service Monitor {
  // Fire-and-forget is not a second messaging path: it is a method returning
  // Empty, called on an async stub, which therefore does not block its caller.
  rpc Report (Trouble) returns (Empty);
}


// ============================================================================
// PageRank: the same ten phases, run again and again.
//
// Word count is one pass. PageRank is the same pass over the same graph until
// the numbers stop moving, and running it on MapReduce is the standard way to
// discover what MapReduce is bad at: there is no state between iterations, so
// every round re-reads the whole graph, re-writes the whole graph, and re-does
// the entire shuffle. Ten iterations is ten times the disk and ten times the
// network for a computation that only ever needed the graph loaded once.
//
// That is question 4.4 of the assignment, answered in megabytes.
// ============================================================================

// A page, its rank, and where it points. The out-links travel with the rank
// through every iteration — not because anybody wants to send them, but because
// the reducer that computes the next rank is not the machine that had the graph,
// and there is nowhere to leave it.
message Vertex {
  int32          id   = 1;
  double         rank = 2;
  repeated int32 out  = 3;
}

// One machine's share of the graph, for one iteration.
message Slice {
  int32           task      = 1;
  int32           iteration = 2;
  int32           parts     = 3;
  int32           pages     = 4;   // N, for the damping term
  repeated Vertex vertices  = 5;
}

message MapRound {
  int32           task          = 1;
  string          worker        = 2;
  int32           iteration     = 3;
  repeated Region regions       = 4;
  int64           contributions = 5;
}

// What one page sends to another: its rank, divided by how many places it points.
message Contribution { int32 to = 1; double add = 2; }

// A region of a rank map: the contributions, and the graph structure that has to
// ride along with them.
message Portion {
  repeated Contribution contributions = 1;
  repeated Vertex       carried       = 2;
}

message Collect {
  int32           part      = 1;
  int32           iteration = 2;
  int32           pages     = 3;
  repeated string holders   = 4;
  repeated int32  tasks     = 5;
}

message Ranked {
  int32           part      = 1;
  int32           iteration = 2;
  repeated Vertex vertices  = 3;
  double          delta     = 4;   // how far the ranks moved this round
  repeated int32  lost      = 5;
}

service RankMapper {
  rpc Spread (Slice) returns (MapRound) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc Share  (Fetch) returns (Portion)  { option idempotency_level = NO_SIDE_EFFECTS; }
}

// Fetch and fold on the same machine — the fused shape, and the honest one here:
// a rank reducer needs the whole of its partition before it can compute anything,
// so putting a network hop between the gathering and the folding buys nothing.
service RankReducer {
  rpc Fold (Collect) returns (Ranked) { option idempotency_level = NO_SIDE_EFFECTS; }
}
